name: fiapx-processing
services:
  postgres:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: fiapx_processing
      POSTGRES_USER: fiapx_processing
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiapx_processing -d fiapx_processing"]
      interval: 5s
      timeout: 5s
      retries: 10
  processing:
    build:
      context: .
      target: runtime
    image: fiapx-processing-service:local
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fiapx_processing
      DB_USERNAME: fiapx_processing
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD in .env}
      SERVER_PORT: 8082
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50.0"
      PROCESSING_MAX_EXTRACTED_BYTES: ${PROCESSING_MAX_EXTRACTED_BYTES:-1073741824}
      PROCESSING_MAX_ZIP_BYTES: ${PROCESSING_MAX_ZIP_BYTES:-1073741824}
      PROCESSING_TIMEOUT_SECONDS: ${PROCESSING_TIMEOUT_SECONDS:-600}
      PROCESSING_DISK_RESERVE_BYTES: ${PROCESSING_DISK_RESERVE_BYTES:-3221225472}
      PROCESSING_LEASE_SECONDS: ${PROCESSING_LEASE_SECONDS:-120}
      PROCESSING_HEARTBEAT_SECONDS: ${PROCESSING_HEARTBEAT_SECONDS:-30}
    ports:
      - "127.0.0.1:${APP_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    cpus: 2
    volumes:
      - processing-temp:/app/.local
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
volumes:
  postgres-data:
  processing-temp:
